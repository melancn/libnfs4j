name: Android (ARM ABIs)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android-arm:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        abi:
          - armeabi-v7a
          - arm64-v8a

    steps:
      - uses: actions/checkout@v4

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Configure (${{ matrix.abi }})
        run: >
          cmake -B build -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=${{ matrix.abi }}
          -DANDROID_PLATFORM=android-21
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=ON
          -DENABLE_JNI=ON
          -DENABLE_TLS=OFF
          -DCMAKE_INSTALL_PREFIX=$PWD/out

      - name: Build (${{ matrix.abi }})
        run: |
          cmake --build build --verbose
          cmake --install build

      - name: Archive build artifacts (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: libnfs-android-${{ matrix.abi }}
          path: |
            build/lib/libnfs.so
            build/jni/libnfsjni.so
          if-no-files-found: error
